model: "deepseek_r1_distill_qwen_7b"
dataset_config: "configs/datasets.yaml"
dataset_group: "preferences"
output_dir: "outputs/dpo"
seed: 42
max_length: 4096
max_prompt_length: 2048
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.000005
num_train_epochs: 1
beta: 0.1
loss_type: "sigmoid"
resume_from_checkpoint: null
quantization: "4bit"
lora: {enabled: true, r: 16, alpha: 32, dropout: 0.05}
algorithm: "dpo" # dpo | orpo | simpo
gamma_beta_ratio: 0.5 # SimPO target reward margin ratio
