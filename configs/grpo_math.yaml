model: "deepseek_r1_distill_qwen_7b"
dataset_config: "configs/datasets.yaml"
dataset_group: "grpo"
output_dir: "outputs/grpo-math"
initial_adapter: "outputs/dpo"
seed: 42
max_prompt_length: 512
max_completion_length: 512
attention_implementation: "sdpa"
use_liger_kernel: true
optim: "paged_adamw_8bit"
loss_type: "dr_grpo"
mask_truncated_completions: true
memory_check_steps: 20
memory_budget_gb: 7.2
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_generations: 2
learning_rate: 0.0000005
num_train_epochs: 1
beta: 0.0
precision: "bf16"
gradient_checkpointing: true
resume_from_checkpoint: null
quantization: "4bit"
lora: {enabled: true, r: 16, alpha: 32, dropout: 0.0}
reward: ["symbolic_equivalence", "boxed_format"]
