[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-training"
version = "0.1.0"
description = "Configurable local post-training workflows for language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
training = ["torch>=2.2", "transformers>=4.45", "trl>=0.22.1", "peft>=0.13", "accelerate>=1.0", "bitsandbytes>=0.44"]
performance = ["liger-kernel>=0.5"]
data = ["datasets>=3.0", "pyarrow>=17.0"]
model-download = ["huggingface-hub>=0.25"]
math = ["sympy>=1.13"]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
